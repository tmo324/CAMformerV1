[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camformer"
version = "1.0.0"
authors = [
  { name="Tergel Molom-Ochir" },
]
description = "Event-driven architectural simulator for CAMformer: Binary Associative Memory Is All You Need."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.3.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]

[project.scripts]
camformer-validate = "experiments.compare_with_paper:main"
camformer-sweep = "experiments.sensitivity_study:main"
